<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>有聲翻頁書｜旁白＋配樂自動播</title>
<script src="vendor/page-flip.browser.js"></script>
<style>
  :root{ --bg:#f4f1ea; --card:#fff; --ink:#2a251f; --muted:#6f665b; --line:#ded7ca;
         --brand:#2f6f5e; --ok:#1f7a4d; --warn:#8a5a12; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17150f; --card:#221f19; --ink:#efe9dd; --muted:#a89e90; --line:#3a342a;
           --brand:#4f9c85; --ok:#5fc593; --warn:#d9ac5e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    font-size:17px;line-height:1.7}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:23px;margin:4px 0 6px}
  .sub{color:var(--muted);font-size:16px;margin:0 0 18px}
  #book{width:100%;max-width:760px;margin:0 auto}
  .page{background:var(--card);overflow:hidden}
  .page img{width:100%;height:100%;object-fit:cover;display:block}
  .bar{max-width:760px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px}
  button{font:inherit;font-size:17px;font-weight:600;border:1px solid var(--line);border-radius:10px;
    padding:13px 16px;cursor:pointer;background:var(--card);color:var(--ink)}
  button.primary{background:var(--brand);color:#fff;border-color:transparent}
  .ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ctrls button{flex:0 0 auto}
  .status{font-size:15px;color:var(--muted);margin-top:10px;white-space:pre-wrap;min-height:1.4em}
  .status.bad{color:#b3372c}
  label{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
  input[type=range]{width:120px}
  .note{font-size:14px;color:var(--muted);background:rgba(217,172,94,.16);
    border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:10px 12px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>有聲翻頁書</h1>
  <p class="sub">按播放，旁白會自己念，念完自動翻下一頁，配樂在底下墊著。</p>

  <div id="book"></div>

  <div class="bar">
    <div class="ctrls">
      <button id="play" class="primary">▶ 播放</button>
      <button id="stop">■ 停止</button>
      <label><input type="checkbox" id="bgmOn" checked> 配樂</label>
      <label>音量 <input type="range" id="bgmVol" min="0" max="100" value="30"></label>
    </div>
    <div class="status" id="status">準備好了。</div>
    <div class="note">
      瀏覽器規定有聲音的內容不能自動播，所以一定要先按一次「播放」。
      旁白音檔放在 <b>audio/</b>，對照表是 <b>narration.json</b>，都由錄音工作台匯出。
    </div>
  </div>
</div>

<script>
(function(){
  // 配樂：SUNO 分享頁背後的直連 mp3（已驗證可跨網域讀取）
  // 正式版建議把檔案下載放進 audio/bgm.mp3，避免外部網址失效
  var BGM_URL = 'https://cdn1.suno.ai/c99e202b-18bd-4038-ba07-e1deecd829ba.mp3';

  var TOTAL = 11;
  var PAGES = [];
  for (var i=1;i<=TOTAL;i++) PAGES.push('images/page-' + String(i).padStart(2,'0') + '.jpg');

  var bookEl = document.getElementById('book');
  PAGES.forEach(function(src, i){
    var page = document.createElement('div');
    page.className = 'page';
    if (i === 0 || i === TOTAL - 1) page.setAttribute('data-density','hard');
    var img = document.createElement('img');
    img.src = src; img.alt = '第 ' + (i+1) + ' 頁';
    page.appendChild(img);
    bookEl.appendChild(page);
  });

  var flip = new St.PageFlip(bookEl, {
    width:900, height:900, size:'stretch',
    minWidth:220, maxWidth:900, minHeight:220, maxHeight:900,
    showCover:true, usePortrait:true, maxShadowOpacity:0.45,
    flippingTime:700, mobileScrollSupport:false, autoSize:true
  });
  flip.loadFromHTML(bookEl.querySelectorAll('.page'));

  var statusBox = document.getElementById('status');
  var playBtn = document.getElementById('play');
  var stopBtn = document.getElementById('stop');
  var bgmOn = document.getElementById('bgmOn');
  var bgmVol = document.getElementById('bgmVol');

  var manifest = null, playing = false, cur = 0;
  var narr = new Audio();
  var bgm = new Audio();
  bgm.loop = true;
  bgm.crossOrigin = 'anonymous';

  function say(msg, cls){ statusBox.textContent = msg; statusBox.className = 'status' + (cls?' '+cls:''); }
  function baseVol(){ return Number(bgmVol.value)/100; }
  function duckVol(){ return baseVol() * 0.35; }   // 旁白講話時把配樂壓下去

  fetch('narration.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('沒有 narration.json'); return r.json(); })
    .then(function(j){
      manifest = j;
      var n = j.pages.filter(function(p){ return p.audio; }).length;
      say('讀到 narration.json，' + n + ' 頁有旁白。按播放開始。');
    })
    .catch(function(){
      say('還沒有 narration.json，現在只會播配樂、不會自動翻頁。\n先去錄音工作台（narrate.html）錄好旁白並下載。', 'bad');
    });

  function playPage(i){
    if (!playing) return;
    if (i >= TOTAL){ finish('播完了。'); return; }
    cur = i;
    if (flip.getCurrentPageIndex() !== i) flip.turnToPage(i);

    var item = manifest && manifest.pages[i];
    if (!item || !item.audio){
      say('第 ' + (i+1) + ' 頁沒有旁白，兩秒後翻下一頁。');
      setTimeout(function(){ playPage(i+1); }, 2000);
      return;
    }
    say('正在念第 ' + (i+1) + ' 頁…');
    bgm.volume = duckVol();
    narr.src = item.audio;
    narr.play().catch(function(err){
      say('第 ' + (i+1) + ' 頁的音檔播不出來（' + item.audio + '）：' + (err && err.name || err), 'bad');
      setTimeout(function(){ playPage(i+1); }, 1200);
    });
  }

  narr.addEventListener('ended', function(){
    bgm.volume = baseVol();
    setTimeout(function(){ playPage(cur + 1); }, 600);   // 留一點呼吸再翻頁
  });

  playBtn.addEventListener('click', function(){
    if (playing) return;
    playing = true;
    if (bgmOn.checked){
      bgm.src = BGM_URL;
      bgm.volume = baseVol();
      bgm.play().catch(function(){ say('配樂載不動，只播旁白。'); });
    }
    playPage(flip.getCurrentPageIndex());
  });

  stopBtn.addEventListener('click', function(){ finish('已停止。'); });

  function finish(msg){
    playing = false;
    narr.pause(); narr.currentTime = 0;
    bgm.pause(); bgm.currentTime = 0;
    say(msg);
  }

  bgmVol.addEventListener('input', function(){
    bgm.volume = (narr.paused ? baseVol() : duckVol());
  });
  bgmOn.addEventListener('change', function(){
    if (!bgmOn.checked) bgm.pause();
    else if (playing){ bgm.src = BGM_URL; bgm.volume = duckVol(); bgm.play().catch(function(){}); }
  });
})();
</script>
</body>
</html>
