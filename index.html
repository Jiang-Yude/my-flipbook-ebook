<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旅遊故事書 · 翻頁電子書 Demo</title>
<style>
  :root {
    --paper: #f7f2e6;
    --ink: #4a4033;
    --accent: #9c6b3f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: radial-gradient(ellipse at 50% 0%, #f6f0e3 0%, #e8ddc6 75%);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    overflow: hidden;
  }
  .stage {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 20px 12px;
  }
  .title {
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--accent);
    opacity: 0.75;
    user-select: none;
  }
  .book-wrap {
    width: min(94vw, 1240px);
    max-height: 72vh;
    display: flex;
    justify-content: center;
    position: relative;
  }

  /* ===== 封面左側標題區（封面單獨顯示時，補左半邊留白）===== */
  .cover-intro {
    position: absolute;
    left: 0; top: 0;
    width: 50%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 7% 0 5%;
    gap: clamp(10px, 1.8vh, 22px);
    pointer-events: none;
    user-select: none;
    opacity: 1;
    transition: opacity 0.45s ease;
  }
  .cover-intro.hidden { opacity: 0; }
  .cover-intro .ci-kicker {
    margin: 0;
    font-size: clamp(12px, 1.2vw, 16px);
    letter-spacing: 0.22em;
    color: var(--accent);
    opacity: 0.85;
  }
  .cover-intro h1 {
    margin: 0;
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: clamp(24px, 3.2vw, 44px);
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 0.06em;
  }
  .cover-intro .ci-text {
    margin: 0;
    font-size: clamp(14px, 1.35vw, 18px);
    line-height: 1.9;
    opacity: 0.78;
    max-width: 30em;
  }
  /* 不加自訂陰影：翻頁引擎自己會畫頁面陰影，外加 drop-shadow 會在翻頁時產生殘影 */

  /* ===== 頁面共用 ===== */
  .page {
    background: var(--paper);
    overflow: hidden;
    /* 讓內文字級跟著頁面實際大小縮放（container query 單位 cqw） */
    container-type: size;
  }
  .page img.full {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* ===== 介紹頁（story）===== */
  .story {
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #faf6ec, #efe5cf);
  }
  .story .photo {
    height: 52%;
    overflow: hidden;
    flex: none;
  }
  .story .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .story .body {
    flex: 1;
    padding: 5cqh 7cqw;
    display: flex;
    flex-direction: column;
    gap: 3.2cqh;
    min-height: 0;
  }
  .story h2 {
    margin: 0;
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: 6.4cqw;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1.25;
  }
  .story .location {
    display: inline-flex;
    align-items: center;
    gap: 1.6cqw;
    align-self: flex-start;
    font-size: 3.2cqw;
    letter-spacing: 0.06em;
    color: var(--accent);
    border: 1px solid rgba(156,107,63,0.35);
    border-radius: 99px;
    padding: 0.9cqh 3cqw;
    background: rgba(255,255,255,0.5);
  }
  .story .location svg { width: 3.4cqw; height: 3.4cqw; flex: none; }
  .story p {
    margin: 0;
    font-size: 3.6cqw;
    line-height: 1.75;
    overflow: hidden;
  }

  /* ===== 地圖頁（map）===== */
  .mappage {
    display: flex;
    flex-direction: column;
    width: 100%; height: 100%;
    background: linear-gradient(160deg, #faf6ec, #efe5cf);
    padding: 4.5cqh 5cqw;
    gap: 2.4cqh;
  }
  .mappage h2 {
    margin: 0;
    font-family: "Noto Serif TC", "PingFang TC", serif;
    font-size: 5.6cqw;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .mappage .mapbox {
    flex: 1;
    min-height: 0;
    border-radius: 1.8cqw;
    overflow: hidden;
    border: 1px solid rgba(74,64,51,0.18);
    background: #e9e4d8;
  }
  .mappage iframe {
    width: 100%; height: 100%;
    border: 0;
    display: block;
  }
  .mappage .note {
    margin: 0;
    font-size: 3cqw;
    opacity: 0.6;
    letter-spacing: 0.04em;
  }

  /* ===== 控制列 ===== */
  .controls {
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .nav-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(74,64,51,0.18);
    background: rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, opacity 0.2s;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.9); }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
  .nav-btn svg { width: 18px; height: 18px; }
  .counter {
    font-family: "Noto Serif TC", serif;
    font-size: 14px;
    letter-spacing: 0.1em;
    min-width: 72px;
    text-align: center;
    opacity: 0.8;
    user-select: none;
  }
  .hint {
    font-size: 12.5px;
    opacity: 0.45;
    letter-spacing: 0.04em;
    transition: opacity 0.6s ease;
    user-select: none;
    text-align: center;
  }
  .hint.hidden { opacity: 0; }
</style>
</head>
<body>
  <div class="stage">
    <div class="title">旅遊故事書 DEMO</div>
    <div class="book-wrap">
      <div class="cover-intro" id="coverIntro">
        <p class="ci-kicker">翻頁電子書套版 DEMO</p>
        <h1>把圖片套電子書範例</h1>
        <p class="ci-text">把一疊 1:1 的圖片放進 images 資料夾，就自動變成一本可以翻的電子書。滑鼠拖著頁角翻頁、方向鍵快速翻、手機直接滑。內頁還能換成「地點介紹頁」和可以縮放的「Google 地圖頁」，變成一本旅遊故事書。</p>
      </div>
      <div id="book"></div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn" aria-label="上一頁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="counter" id="counterText">1 / 11</div>
      <button class="nav-btn" id="nextBtn" aria-label="下一頁">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div class="hint" id="hint"></div>
  </div>

<script src="vendor/page-flip.browser.js"></script>
<script>
(function () {
  // ============================================================
  // 套版設定：換內容只需改這個 PAGES 陣列
  //
  // 三種頁型：
  //   { type: 'image', src: '圖片路徑' }                     ← 滿版照片頁
  //   { type: 'story', img, title, location, text }          ← 介紹頁（照片＋地點＋文字）
  //   { type: 'map',   title, query, note }                  ← Google 地圖頁（可縮放點選）
  //
  // 建議總頁數為「奇數」（封面 1 + 偶數張內頁），攤開跨頁才會成對。
  // ============================================================
  var PAGES = [
    { type: 'image', src: 'images/page-01.jpg' }, // 封面
    { type: 'image', src: 'images/page-02.jpg' },
    {
      type: 'story',
      img: 'images/page-03.jpg',
      title: '出發，往水的方向',
      location: '義大利 · 威尼斯',
      text: '整座城市建在潟湖之上，沒有汽車，只有船和步行。轉進任何一條小巷，都可能撞見一座三百年的石橋。'
    },
    {
      type: 'map',
      title: '這一站：聖馬可廣場',
      query: 'Piazza San Marco, Venezia, Italy',
      note: '地圖可以直接縮放、拖曳、點景點（翻頁請用頁角、按鈕或方向鍵）'
    },
    { type: 'image', src: 'images/page-04.jpg' },
    { type: 'image', src: 'images/page-05.jpg' },
    { type: 'image', src: 'images/page-06.jpg' },
    { type: 'image', src: 'images/page-07.jpg' },
    { type: 'image', src: 'images/page-08.jpg' },
    { type: 'image', src: 'images/page-09.jpg' },
    { type: 'image', src: 'images/page-11.jpg' }  // 封底
  ];
  // ============================================================

  var bookEl = document.getElementById('book');
  var counterText = document.getElementById('counterText');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var hint = document.getElementById('hint');
  var TOTAL = PAGES.length;

  // 依裝置顯示對應操作提示
  var isTouch = window.matchMedia('(pointer: coarse)').matches;
  hint.textContent = isTouch
    ? '左右滑動翻頁，也可以拖著頁角翻'
    : '滑鼠移到頁角會捲起，拖著頁角翻頁　·　方向鍵 ← → 快速翻頁';

  // ===== 頁面產生器 =====
  function buildImagePage(cfg, i) {
    var img = document.createElement('img');
    img.className = 'full';
    img.src = cfg.src;
    img.alt = cfg.alt || ('第 ' + (i + 1) + ' 頁');
    img.draggable = false;
    return [img];
  }

  function buildStoryPage(cfg) {
    var wrap = document.createElement('div');
    wrap.className = 'story';

    var photo = document.createElement('div');
    photo.className = 'photo';
    var img = document.createElement('img');
    img.src = cfg.img;
    img.alt = cfg.title;
    img.draggable = false;
    photo.appendChild(img);

    var body = document.createElement('div');
    body.className = 'body';
    var h2 = document.createElement('h2');
    h2.textContent = cfg.title;
    var loc = document.createElement('span');
    loc.className = 'location';
    loc.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>';
    loc.appendChild(document.createTextNode(cfg.location));
    var p = document.createElement('p');
    p.textContent = cfg.text;
    body.appendChild(h2);
    body.appendChild(loc);
    body.appendChild(p);

    wrap.appendChild(photo);
    wrap.appendChild(body);
    return [wrap];
  }

  function buildMapPage(cfg) {
    var wrap = document.createElement('div');
    wrap.className = 'mappage';

    var h2 = document.createElement('h2');
    h2.textContent = cfg.title;

    var box = document.createElement('div');
    box.className = 'mapbox';
    var iframe = document.createElement('iframe');
    iframe.src = 'https://maps.google.com/maps?q=' + encodeURIComponent(cfg.query) + '&z=15&output=embed';
    iframe.loading = 'lazy';
    iframe.referrerPolicy = 'no-referrer-when-downgrade';
    iframe.title = cfg.title + ' 地圖';
    box.appendChild(iframe);

    wrap.appendChild(h2);
    wrap.appendChild(box);
    if (cfg.note) {
      var note = document.createElement('p');
      note.className = 'note';
      note.textContent = cfg.note;
      wrap.appendChild(note);
    }
    return [wrap];
  }

  PAGES.forEach(function (cfg, i) {
    var page = document.createElement('div');
    page.className = 'page';
    // 封面與封底做成硬頁（像精裝書封面整片翻），內頁軟頁（頁角捲曲）
    if (i === 0 || i === TOTAL - 1) page.setAttribute('data-density', 'hard');
    var children =
      cfg.type === 'story' ? buildStoryPage(cfg) :
      cfg.type === 'map' ? buildMapPage(cfg) :
      buildImagePage(cfg, i);
    children.forEach(function (c) { page.appendChild(c); });
    bookEl.appendChild(page);
  });

  var pageFlip = new St.PageFlip(bookEl, {
    width: 900,               // 單頁基準尺寸（1:1 正方形）
    height: 900,
    size: 'stretch',
    minWidth: 220,
    maxWidth: 900,
    minHeight: 220,
    maxHeight: 900,
    showCover: true,          // 封面、封底單獨成頁
    usePortrait: true,        // 窄螢幕（手機直向）自動切單頁模式
    maxShadowOpacity: 0.45,
    flippingTime: 700,
    mobileScrollSupport: false,
    autoSize: true
  });

  pageFlip.loadFromHTML(bookEl.querySelectorAll('.page'));

  var state = 'read';
  pageFlip.on('changeState', function (e) { state = e.data; });

  var coverIntro = document.getElementById('coverIntro');

  function updateCounter() {
    var idx = pageFlip.getCurrentPageIndex();
    var landscape = pageFlip.getOrientation() === 'landscape';
    var isSpread = landscape && idx > 0 && idx + 1 <= TOTAL - 1;
    counterText.textContent = isSpread
      ? (idx + 1) + '-' + (idx + 2) + ' / ' + TOTAL
      : (idx + 1) + ' / ' + TOTAL;
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx + (isSpread ? 2 : 1) > TOTAL - 1;
    // 封面標題區：只在「封面單獨顯示＋攤開模式」時出現，補左半邊留白
    coverIntro.classList.toggle('hidden', !(idx === 0 && landscape));
  }
  pageFlip.on('flip', function () {
    hint.classList.add('hidden');
    updateCounter();
  });
  pageFlip.on('changeOrientation', updateCounter);
  updateCounter();

  function goNext() { if (state === 'read') pageFlip.flipNext(); }
  function goPrev() { if (state === 'read') pageFlip.flipPrev(); }

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);

  // 鍵盤方向鍵：按住可連續快速翻頁
  var keyHoldTimer = null;
  var keyHoldAction = null;
  function startKeyHold(action) {
    if (keyHoldTimer) return;
    keyHoldAction = action;
    action();
    keyHoldTimer = setInterval(function () { keyHoldAction(); }, 380);
  }
  function stopKeyHold() {
    if (keyHoldTimer) { clearInterval(keyHoldTimer); keyHoldTimer = null; }
    keyHoldAction = null;
  }
  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); if (!e.repeat) startKeyHold(goNext); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!e.repeat) startKeyHold(goPrev); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') stopKeyHold();
  });
  window.addEventListener('blur', stopKeyHold);

  // 點過地圖 iframe 後，鍵盤焦點會被 iframe 吃走、方向鍵失效；
  // 偵測到焦點掉進 iframe 就拿回來（地圖的滑鼠縮放拖曳不受影響）
  window.addEventListener('blur', function () {
    setTimeout(function () {
      var ae = document.activeElement;
      if (ae && ae.tagName === 'IFRAME') ae.blur();
    }, 0);
  });

  // 對外小 API：外部按鈕或自動化測試用
  window.Flipbook = {
    next: goNext,
    prev: goPrev,
    getIndex: function () { return pageFlip.getCurrentPageIndex(); },
    isBusy: function () { return state !== 'read'; },
    getState: function () { return state; },
    getOrientation: function () { return pageFlip.getOrientation(); },
    total: TOTAL,
    engine: pageFlip
  };
})();
</script>
</body>
</html>
