<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>會唱歌的翻頁繪本</title>
<script src="vendor/page-flip.browser.js"></script>
<style>
  :root{ --bg:#f4f1ea; --card:#fff; --ink:#2a251f; --muted:#6f665b; --line:#ded7ca;
         --brand:#2f6f5e; --accent:#b3372c; --warn:#8a5a12; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17150f; --card:#221f19; --ink:#efe9dd; --muted:#a89e90; --line:#3a342a;
           --brand:#4f9c85; --accent:#d4675a; --warn:#d9ac5e; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
    font-size:17px;line-height:1.7}
  .wrap{max-width:860px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:24px;margin:4px 0 4px;text-align:center}
  .sub{color:var(--muted);font-size:16px;margin:0 0 16px;text-align:center}

  /* 播放列：釘在上面，翻頁時音樂不斷 */
  .player{position:sticky;top:0;z-index:30;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px;margin-bottom:16px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .player button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:999px;
    padding:11px 22px;cursor:pointer;background:var(--brand);color:#fff}
  .player .time{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
  .player label{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:7px}
  .player input[type=range]{width:100px}
  .player .msg{font-size:14px;color:var(--muted);flex-basis:100%}
  .player .msg.bad{color:var(--accent)}

  #book{width:100%;max-width:760px;margin:0 auto}
  .page{background:var(--card);overflow:hidden}
  .page img{width:100%;height:100%;object-fit:cover;display:block}

  .nav{display:flex;gap:10px;max-width:760px;margin:14px auto 0}
  .nav button{flex:1;font:inherit;font-size:17px;font-weight:600;border:1px solid var(--line);
    border-radius:10px;padding:13px;cursor:pointer;background:var(--card);color:var(--ink)}
  .pgno{align-self:center;font-size:15px;color:var(--muted);min-width:74px;text-align:center}

  .lyric{max-width:760px;margin:20px auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:20px 24px;text-align:center}
  .lyric .tag{font-size:14px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
  .lyric p{margin:0;font-size:21px;line-height:1.9;white-space:pre-wrap}
  .lyric p.none{font-size:17px;color:var(--muted)}

  details{max-width:760px;margin:16px auto 0;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 18px}
  summary{cursor:pointer;font-weight:600}
  details pre{white-space:pre-wrap;font:inherit;font-size:16px;color:var(--muted);margin:10px 0 0}
  .note{max-width:760px;margin:16px auto 0;font-size:14px;color:var(--muted);
    background:rgba(217,172,94,.16);border-left:3px solid var(--warn);
    border-radius:0 8px 8px 0;padding:10px 12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>會唱歌的翻頁繪本</h1>
  <p class="sub">按播放聽歌，自己翻頁。翻到哪一頁，就顯示那一段歌詞。</p>

  <div class="player">
    <button id="toggle">▶ 播放</button>
    <span class="time" id="time">0:00</span>
    <label>音量 <input type="range" id="vol" min="0" max="100" value="85"></label>
    <span class="msg" id="msg"></span>
  </div>

  <div id="book"></div>

  <div class="nav">
    <button id="prev">← 上一頁</button>
    <span class="pgno" id="pgno">1 / 11</span>
    <button id="next">下一頁 →</button>
  </div>

  <div class="lyric">
    <div class="tag" id="lyTag">這一頁的歌詞</div>
    <p id="lyText" class="none">（還沒填歌詞）</p>
  </div>

  <details>
    <summary>看完整歌詞</summary>
    <pre id="allLyrics"></pre>
  </details>

  <div class="note">
    歌詞與音檔都寫在這一頁的最上方（LYRICS 與 SONG_URL），改那兩個地方就好。
    音檔目前吃 SUNO 的分享連結，正式版建議把 mp3 下載放進 <b>audio/</b>，避免外部網址失效。
  </div>
</div>

<script>
(function(){
  // ── 改這裡就好 ──────────────────────────────────────
  var SONG_URL = 'https://cdn1.suno.ai/c99e202b-18bd-4038-ba07-e1deecd829ba.mp3';

  // 一頁一段。順序＝頁碼，留空字串就是那頁沒有歌詞。
  var LYRICS = [
    '', '', '', '', '', '', '', '', '', '', ''
  ];
  // ──────────────────────────────────────────────────

  var TOTAL = 11;
  var PAGES = [];
  for (var i=1;i<=TOTAL;i++) PAGES.push('images/page-' + String(i).padStart(2,'0') + '.jpg');

  var bookEl = document.getElementById('book');
  PAGES.forEach(function(src, i){
    var page = document.createElement('div');
    page.className = 'page';
    if (i === 0 || i === TOTAL - 1) page.setAttribute('data-density','hard');
    var img = document.createElement('img');
    img.src = src; img.alt = '第 ' + (i+1) + ' 頁';
    page.appendChild(img);
    bookEl.appendChild(page);
  });

  var flip = new St.PageFlip(bookEl, {
    width:900, height:900, size:'stretch',
    minWidth:220, maxWidth:900, minHeight:220, maxHeight:900,
    showCover:true, usePortrait:true, maxShadowOpacity:0.45,
    flippingTime:700, mobileScrollSupport:false, autoSize:true
  });
  flip.loadFromHTML(bookEl.querySelectorAll('.page'));

  var state = 'read';
  flip.on('changeState', function(e){ state = e.data; });
  flip.on('flip', showPage);

  var $ = function(id){ return document.getElementById(id); };
  var audio = new Audio();
  audio.crossOrigin = 'anonymous';
  audio.preload = 'none';
  audio.src = SONG_URL;
  audio.volume = 0.85;

  function fmt(s){
    if (!isFinite(s)) return '0:00';
    var m = Math.floor(s/60), r = Math.floor(s%60);
    return m + ':' + String(r).padStart(2,'0');
  }

  $('toggle').addEventListener('click', function(){
    if (audio.paused){
      audio.play().then(function(){
        $('toggle').textContent = '❚❚ 暫停';
        $('msg').textContent = '';
      }).catch(function(err){
        $('msg').textContent = '音樂播不出來：' + (err && err.name || err) + '（音檔網址可能失效了）';
        $('msg').className = 'msg bad';
      });
    } else {
      audio.pause();
      $('toggle').textContent = '▶ 播放';
    }
  });
  audio.addEventListener('ended', function(){ $('toggle').textContent = '▶ 播放'; });
  audio.addEventListener('timeupdate', function(){
    $('time').textContent = fmt(audio.currentTime) + (isFinite(audio.duration) ? ' / ' + fmt(audio.duration) : '');
  });
  $('vol').addEventListener('input', function(){ audio.volume = Number(this.value)/100; });

  $('prev').addEventListener('click', function(){ if(state==='read') flip.flipPrev(); });
  $('next').addEventListener('click', function(){ if(state==='read') flip.flipNext(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' && state === 'read') flip.flipPrev();
    if (e.key === 'ArrowRight' && state === 'read') flip.flipNext();
  });

  function showPage(){
    var i = flip.getCurrentPageIndex();
    $('pgno').textContent = (i+1) + ' / ' + TOTAL;
    var ly = (LYRICS[i] || '').trim();
    $('lyTag').textContent = '第 ' + (i+1) + ' 頁的歌詞';
    $('lyText').textContent = ly || '（這一頁還沒填歌詞）';
    $('lyText').className = ly ? '' : 'none';
  }

  $('allLyrics').textContent =
    LYRICS.map(function(l, i){ return 'P' + String(i+1).padStart(2,'0') + '　' + (l || '（空）'); }).join('\n');

  showPage();
})();
</script>
</body>
</html>
